# Harar Open Air Cinema — PUBLIC HTTPS TEST deployment (Render Blueprint, $0).
# ONE web service: Express serves the API + built frontend from the same origin.
# Database: Neon free-tier Postgres, created once in the Neon dashboard — its
# connection string (already including ?sslmode=require) goes into DATABASE_URL.
# Secrets are NEVER stored here (sync: false → entered in the Render dashboard).
# No VITE_* variables: the frontend uses same-origin /api; mock mode stays off.
# Node version is pinned via package.json "engines" + .node-version (Node 22).
# Free behavior: the web service sleeps after 15 min idle (wakes in ~30-60 s);
# Neon compute scales to zero and wakes in milliseconds. No disk is needed —
# all booking/payment data lives in Neon and survives redeploys and sleeps.

services:
  - type: web
    name: harar-cinema-test
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Seeds the premiere event + admin user (idempotent — existing rows are
    # never touched). Runs before every deploy; no Shell access needed.
    preDeployCommand: npm run db:seed
    healthCheckPath: /api/events
    envVars:
      # Render injects PORT automatically — do not set it here. The server
      # listens on process.env.PORT (see server/src/config.ts + index.ts).
      - key: DATABASE_URL
        sync: false # Neon Postgres connection string (from the Neon dashboard)
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_NAME
        value: Harar Cinema Admin
      - key: ADMIN_EMAIL
        value: admin@harar-cinema.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false # dashboard webhook "Secret Hash" (authenticates webhooks only)
      - key: CHAPA_MODE
        value: test
      # PAYMENT_METHODS intentionally omitted: unset = nothing advertised
      # (fail closed). Add codes later, one rail at a time, only after each
      # rail completes a real Chapa test checkout. Example:
      # - key: PAYMENT_METHODS
      #   value: TELEBIRR
      # PUBLIC_BASE_URL / PUBLIC_API_URL intentionally omitted: the app falls
      # back to Render's injected RENDER_EXTERNAL_URL (public https origin).
      # Set them explicitly only when using a custom domain.
      - key: PAYMENT_WINDOW_MINUTES
        value: 30
